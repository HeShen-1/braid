{{/* 密钥面(values→Secret;D-2026-09-30-t144-helm 决策 5)。
     required 执法 = compose ${VAR:?} fail-fast 对齐:缺必填键渲染即败
     (verify.sh 断言 7)。默认值恒空(values.yaml;verify.sh 断言 8)。
     existingSecret 选路:设则本模板整体跳过,组件/hook 全部引用该 Secret,
     键名契约 = 本文件 stringData 键(含 DSN——内嵌 release 限定的 Service
     主机名,预建 Secret 须按目标 release 组合,见 chart README)。 */}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "braid.fullname" . }}-secret
  labels:
    {{- include "braid.labels" (dict "ctx" . "component" "delivery") | nindent 4 }}
type: Opaque
stringData:
  mysql-root-password: {{ required "secrets.mysqlRootPassword is required (MYSQL_ROOT_PASSWORD)" .Values.secrets.mysqlRootPassword | quote }}
  db-api-password: {{ required "secrets.dbApiPassword is required (charset [A-Za-z0-9._~@+%-])" .Values.secrets.dbApiPassword | quote }}
  db-worker-password: {{ required "secrets.dbWorkerPassword is required (charset [A-Za-z0-9._~@+%-])" .Values.secrets.dbWorkerPassword | quote }}
  db-relay-password: {{ required "secrets.dbRelayPassword is required (charset [A-Za-z0-9._~@+%-])" .Values.secrets.dbRelayPassword | quote }}
  db-reaper-password: {{ required "secrets.dbReaperPassword is required (charset [A-Za-z0-9._~@+%-])" .Values.secrets.dbReaperPassword | quote }}
  auth-jwt-secret: {{ required "secrets.authJwtSecret is required (BRAID_AUTH_JWT_SECRET, openssl rand -hex 32)" .Values.secrets.authJwtSecret | quote }}
  llm-api-key: {{ required "secrets.llmApiKey is required (BRAID_LLM_API_KEY)" .Values.secrets.llmApiKey | quote }}
  # 组件 DSN 整串(内嵌密码 → Secret;host = release 限定 Service 名):
  api-dsn: {{ printf "braid_api:%s@tcp(%s:3306)/braid" .Values.secrets.dbApiPassword (include "braid.mysqlHost" .) | quote }}
  worker-dsn: {{ printf "braid_worker:%s@tcp(%s:3306)/braid" .Values.secrets.dbWorkerPassword (include "braid.mysqlHost" .) | quote }}
  relay-dsn: {{ printf "braid_relay:%s@tcp(%s:3306)/braid" .Values.secrets.dbRelayPassword (include "braid.mysqlHost" .) | quote }}
  reaper-dsn: {{ printf "braid_reaper:%s@tcp(%s:3306)/braid" .Values.secrets.dbReaperPassword (include "braid.mysqlHost" .) | quote }}
  # 可选键(空值合法 = 进程内缺省行为,compose ${VAR:-} 同面):
  tool-token-secret: {{ .Values.secrets.toolTokenSecret | quote }}
  smtp-password: {{ .Values.secrets.smtpPassword | quote }}
  dbquery-dsn: {{ .Values.secrets.dbQueryDsn | quote }}
  # oidc 组开则渲染期必填(审计收口 ⑨:与 issuer/clientId/redirectUrl 的
  # required 同层执法,不再留给进程兜底):
  {{- if .Values.oidc.enabled }}
  oidc-client-secret: {{ required "secrets.oidcClientSecret is required when oidc.enabled" .Values.secrets.oidcClientSecret | quote }}
  {{- else }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
{{- end }}
