{{/* reaper(prod compose reaper 服务的 K8s 形态;4 键对齐)。
     雪花节点 auto(租约池分配,T15.2 摘钉;compose 侧显式 3 单副本语义)。 */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "braid.fullname" . }}-reaper
  labels:
    {{- include "braid.labels" (dict "ctx" . "component" "reaper") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.reaper }} # >1 需外部雪花节点号分配(见 values 注释)
  selector:
    matchLabels:
      {{- include "braid.selectorLabels" (dict "ctx" . "component" "reaper") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "braid.selectorLabels" (dict "ctx" . "component" "reaper") | nindent 8 }}
    spec:
      containers:
        - name: reaper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/reaper"]
          securityContext:
            runAsNonRoot: true
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: BRAID_MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "braid.secretName" . }}
                  key: reaper-dsn
            - name: BRAID_REDIS_QUEUE_ADDR
              value: {{ printf "%s:6379" (include "braid.redisHost" .) | quote }}
            - name: BRAID_REAPER_SNOWFLAKE_NODE
              value: "auto" # T15.2(D-t151 决策 2):租约池分配(PID 派生已退役);静态钉 1/2/3 已摘钉
            - name: BRAID_METRICS_ADDR
              value: "0.0.0.0:9090"
