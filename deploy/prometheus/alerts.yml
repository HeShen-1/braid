# braid 告警规则集(T6.4,ARCHITECTURE §2 可观测 / §4.6 告警集)。
#
# 消费面:reaper(gauge 采集 = 周期 SQL 快照)、relay(投递/Redis 探测)、
# worker(notify/asynq archived/SMTP 可用性)、api(登录)、scheduler/
# llm(429/discarded)。指标词汇表真源 = internal/metrics(闭集锚测试),
# 本文件的指标名与 label 值必须与之一致——漂移在 promtool 单测红。
#
# 分级口径:critical = 数据/资金/任务丢失面(死信、通知丢失、已计费零
# 台账、Redis 逐出前兆);warning = 积压/老化/防御触发(排水自愈面)。
#
# 聚合口径(T15.6 R9 重标定,D-t151 决策 7):共享态 gauge(reaper 的
# SQL 快照 / worker-relay 的同一 Redis 探测)多副本各曝一份相同全量值
# ——sum = N×虚胖,一律 max(单副本恒等;fail-open 窗免疫)。本辖事件
# 计数器(登录/LLM/回滚拒绝)是各副本自有事件流,sum 语义正确保持。
# reaper flush/janitor 已纳入三键 leaderGate(T15.6 定档 A),稳态单报告者;
# max 使聚合不依赖该结构巧合。
groups:
  - name: braid-dead-letters
    rules:
      - alert: OutboxDeadLetter
        expr: max(braid_outbox_rows{status="dead"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "outbox 死信 {{ $value }} 行(relay 投递穷尽)"
          description: "投递退避穷尽转 DEAD,事件永不再投。恢复 = T7.4 runbook:核验 Redis 无该 task_id 后人工重置 PENDING。字源 braid_outbox_rows{status=dead}(reaper gauge)。"
      - alert: AsynqArchivedDeadLetters
        expr: max(braid_asynq_archived_tasks) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "asynq archived 死信 {{ $value }} 条(Redis 侧,DB 无痕)"
          description: "worker handler 二次失败进 archived。resume/notify 族的事件对账网见 D-t42 §8-②/D-t43;人工恢复 = asynq Inspector RunTask。"
      - alert: ResumeArchivedStranded
        expr: max(braid_resume_stuck_rows) > 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} 个已决审批的续跑事件滞留(⑤a 谓词持续命中)"
          description: "已决票/已升级但续跑事件死或滞留,执行永挂 WAITING_APPROVAL(D-t42 §8-②)。reaper 每 tick 幂等重投仍不收敛 = 深层故障,查 relay 队列与 outbox DEAD。"
      - alert: ApprovalNotifyMissing
        # 门闸 unless 形(对抗审计 A9/A14):max==0(SMTP 全 fleet 未配置)
        # 才静默;braid_smtp_configured 系列缺席(worker 未起/scrape 未及)时
        # unless 右侧为空 → 告警照发(观测 fail-open——series 缺席不该静默
        # critical)。
        expr: max(braid_approval_notify_missing_rows) > 0 unless on() max(braid_smtp_configured) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} 个升级通知丢失(escalated 有行、本轮 notified 缺行)"
          description: "escalated-vs-notified 对账缺口(D-t45 #1;分轮对账 T18.7):升级意图已落、超宽限窗无本轮送达行(waiting 候选按 payload $.round=attempts 匹配;续跑残留 escalated_at 的非 waiting 候选按任意轮)——relay 耗尽转 DEAD 或 worker archived 的统一信号。早轮送达行在场不算已送达,按 round 列核对。braid_smtp_configured==1 门闸:SMTP 未配置时缺失是设计行为,不告警。"

  - name: braid-llm
    rules:
      - alert: LLMRateLimitShareHigh
        expr: |
          sum(rate(braid_llm_http_failures_total{code="429"}[15m]))
            / clamp_min(sum(rate(braid_llm_calls_total[15m])) + sum(rate(braid_llm_http_failures_total[15m])), 0.000001) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "LLM 429 占比 {{ $value | humanizePercentage }}(15m 窗)"
          description: "含被适配器重试吸收的中间 429(D-t36 口径)。持续高位 = 供应商限流或配额耗尽,节点重试预算正在被烧。"
      - alert: LLMBilledCallDiscarded
        expr: increase(braid_llm_calls_discarded_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} 次已计费调用被让位丢弃(零台账)"
          description: "reaper 判死后迟到 SUCCEEDED 携 usage 丢弃(D-t36 §7):供应商已计费,平台台账双缺,唯一凭证 = llm.call.discarded 审计行。偶发 = 判死双执行竞态;持续 = DeadGrace 配置与真实执行时延失配。"

  - name: braid-backlog
    rules:
      - alert: ApprovalBacklogHigh
        expr: max(braid_approval_backlog_rows) > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "待审积压 {{ $value }} 个"
          description: "WAITING_APPROVAL × 活执行存量。审批触达面(SMTP 配置/收件人)与超时升级是否正常需一并核查。"
      - alert: ApprovalBacklogAging
        expr: max(braid_approval_backlog_oldest_age_seconds) > 14400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "最老待审已挂起超过 {{ $value | humanizeDuration }}"
          description: "超过 4h 的待审接近默认 72h 超时升级线;升级与通知链路(T4.3/T4.5)是否健康需核查。"
      - alert: StuckNodeCandidatesHigh
        expr: max(braid_stuck_node_candidates) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "卡死候选 {{ $value }} 个(心跳丢失/deadline 超期/执行静默)"
          description: "reaper 三扫描候选水位(与处置计数 braid_reaper_reaped_total 互补:水位持续高 + 处置不落 = 处置事务失败;水位高 + 处置落 = 判死循环重派)。"
      - alert: AuditPendingBacklog
        expr: max(braid_audit_pending_oldest_age_seconds) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "审计暂存最老行滞留 {{ $value | humanizeDuration }}(可见性滞后失真)"
          description: "AuditFlushInterval 默认 1s = 审计可见性滞后上界;oldest 持续 >30s = flush 排水速率不足或间隔旋钮被放大(D-t61 无上界观测面)。T6.3 查询面按滞后上界口径承诺,此告警是承诺的守护线。"
      - alert: AuditFlushPoisonRows
        expr: increase(braid_audit_flush_poison_rows_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "审计毒行 {{ $value }} 行(ghost execution 等)"
          description: "暂存行因执行行缺失无法搬运,永久滞留且每 tick 重扫。多为测试残留或执行被外部删除;查 audit_pending.execution_id 与 workflow_execution 是否成对。"

  - name: braid-infra
    rules:
      - alert: QueueRedisMemoryWatermark
        expr: |
          max(braid_redis_memory_used_bytes) / max(braid_redis_memory_max_bytes) > 0.8
            and max(braid_redis_memory_max_bytes) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "队列 Redis 内存水位 {{ $value | humanizePercentage }}"
          description: "noeviction 实例写满 = 入队开始失败(noerr OOM),队列面静默停摆(ARCHITECTURE §2 队列实例水线告警)。0.8 = 扩容/排水行动线。"

      # T17.4 DB 连接池双条:水位预警 + 等待事实。容量契约真源 = deploy/
      # README.md §1(BRAID_DB_MAX_OPEN 默认 25、常驻四入口 Σ=100、MySQL
      # max_connections 151 − 预留 ≥30、单进程软上限 100);CAPACITY.md §1
      # 方差带(负载窗 ±2×)由 for 窗吸收、§4 结论 3(并发度 = f(DB 写延迟))
      # 是池满的结构性成因锚。指标面 = T7.1 dbpool 采集器(braid_db_pool_*),
      # 本任务只落规则。
      - alert: DbPoolSaturated
        # 逐进程比值(in_use/max_open 同 label 集自动对齐)再取 max:共享
        # 态聚合口径(镜像文件头 T15.6 重标定),单入口饱和即触发。
        expr: max(braid_db_pool_in_use_connections / braid_db_pool_max_open_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DB 连接池水位 {{ $value | humanizePercentage }}(存在饱和入口)"
          description: "in_use/max_open 持续超 0.8 行动线(0.8 镜像 QueueRedisMemoryWatermark)。池满 = DB 写串行段顶格(CAPACITY.md §4 结论 3:吞吐帽在 relay/DB 写侧,加并发先过写串行段)。先查慢事务与锁窗(CAPACITY.md §5 回滚锁窗斜率),再按 deploy/README.md §1 公式(Σ MAX_OPEN ≤ max_connections − 30)调 BRAID_DB_MAX_OPEN。"
      - alert: DbPoolWaiting
        expr: sum(increase(braid_db_pool_wait_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DB 池获取等待 {{ $value }} 次(15m 窗)"
          description: "DBStats.WaitCount 增长 = 池饱和已发生排队(事实信号,非水位预警;各入口事件流 sum 语义正确)。单次等待会让条件在 15m 增量窗内保持为真(fire ~15m 后自愈,可接受的一次性噪声);反复自愈复燃 = 持续饱和,与 DbPoolSaturated 同路处置,扩池前先核 README §1 公式余量。"

  # T17.4 完整性补面:5a 拒绝 / reaper 毒快照 / im_notified 对账。前两条是
  # 防御触发类(warning 家族,同 LoginBruteForce 判据),第三条是通知丢失
  # 面(critical 家族,同 ApprovalNotifyMissing 判据与门闸形态)。
  - name: braid-integrity
    rules:
      - alert: ResumeEventRejected
        expr: sum(increase(braid_resume_events_rejected_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} 次 resume 事件被 5a 守卫拒绝(15m 窗)"
          description: "execution.resume 事件按面拒绝:stale_round(旧轮重放)/ fabricated(决定行缺或锚错)/ premature(未定局)/ anchor_drift(方向不符)。事件本身仍走 asynq 重试→archived(既有死信可见性不变),本告警补的是防御面观测:持续触发 = 重放源未停、发射面漂移或越权直插。查 reason 分布与对应 approval_decision 行。"
      - alert: ReaperPoisonSnapshot
        expr: sum(increase(braid_reaper_poison_snapshots_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "审批快照毒行拒绝 {{ $value }} 次(1h 窗)"
          description: "input_snapshot 解码失败或 mode/on_timeout 词表外(快照漂移):行保持 WAITING_APPROVAL 且每 tick 重试——永不自动通过也永不自动失败(镜像 AuditFlushPoisonRows 判据)。多为钉版 DSL 与快照物化不一致(升级混跑窗)或外部改写;查 reason 面与 node_execution.input_snapshot。"
      - alert: ApprovalIMNotifyMissing
        # 门闸 unless 形(镜像 ApprovalNotifyMissing / D-t45 #3):max==0
        # (IM 全 fleet 未配置)才静默;braid_im_configured 系列缺席(worker
        # 未起 / scrape 未及)时 unless 右侧为空 → 照发(观测 fail-open)。
        expr: max(braid_approval_im_notified_missing_rows) > 0 unless on() max(braid_im_configured) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} 个 IM 卡片送达丢失(escalated 有行、本轮 im_notified 缺行)"
          description: "IM 通道对账缺口(T17.4,镜像 SMTP 面 D-t45 #1;分轮对账 T18.7):升级意图已落、超 15m 宽限窗无本轮 approval.im_notified 行(waiting 候选按 payload $.round=attempts 匹配;续跑残留 escalated_at 的非 waiting 候选按任意轮)——钉钉 webhook 投递链故障的统一信号(relay 耗尽 / worker archived / webhook 持久失败)。早轮送达行在场不算已送达,按 round 列核对。braid_im_configured==1 门闸:IM 未配置时缺失是设计行为,不告警。"

  - name: braid-auth
    rules:
      - alert: LoginBruteForceSuspected
        expr: sum(rate(braid_login_attempts_total{result="locked"}[15m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "账号锁定持续触发(15m 均 {{ $value }}/s)"
          description: "D-t44 §7-① 登录防御观测面:锁定计数持续触发 = 暴力破解进行中(限流+锁定已减速,不构成破口)。持久层 = login_audit 表按 username 聚合可查攻击面。"

  # T9.2 回滚/续跑面(D-2026-09-28-t92 决策 10)。回滚是显式修复动作:
  # blocked 持续 = reaper settle 链路故障(自动回退不可达,人工必须介入);
  # denied 风暴 = 自动化按阻塞清单退避失败或权限配置错误(角色面)。
  # 「回滚后 stuck RUNNING」的直读 gauge 属停车场(自愈面 = 提交后
  # finishIfDone 失败仅记日志 + reaper ④b FinishIfDone 周期补判)。
  - name: braid-rollback
    rules:
      - alert: RollbackBlockedPersisting
        expr: sum(increase(braid_rollback_denied_total{reason="blocked_inflight"}[15m])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "回滚持续被在飞残留阻塞({{ $value }} 次/15m)"
          description: "orphanQuiet+tick 量级的 settle 窗已过仍持续 409:reaper 收口链路故障或积压。查 reaper 进程与 ⑤b/③ 扫描;自动化重试应按 Retry-After 退避。"
      - alert: RollbackDeniedStorm
        expr: sum(increase(braid_rollback_denied_total[15m])) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "回滚拒绝风暴({{ $value }} 次/15m)"
          description: "自动化重试未按分面退避,或权限/目标配置错误(role_denied/bad_node_id 为主)。查 rollback.denied 审计行的 reason 分布与调用方退避实现。"

  # T9.3 审计哈希链(D-2026-09-29-t93):证据完整性执法面。断链闩已
  # fail-closed(该执行 Append/Enqueue 即拒),本告警 = 人工介入的值守线
  # ——critical 家族(证据丢失/篡改面,同死信分级判据)。
  - name: braid-audit-chain
    rules:
      - alert: AuditChainBroken
        expr: max(braid_audit_chain_broken_heads) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} 条审计哈希链断链(闩已落定,写路径已拒)"
          description: "四族判据之一命中:行篡改/行删除/链尾丢失/分区挪移(D-t93 #5)。该执行新审计写入已被拒绝(fail-closed),需人工取证后复位 chain_heads.broken_at。字源 braid_audit_chain_broken_heads(reaper 第七作业 gauge)。"
