# gitleaks 项目配置(CI gitleaks 作业自动拾取)。
#
# allowlist 理由(2026-09-23,T3.2):internal/tools/command.go 的 sandboxEnv
# 是沙箱 env 构造点,恒以「env 键名字面量 + 运行时变量」拼接形态出现
# (BRAID_TOOL_TOKEN=<运行时签发值>),generic-api-key 规则对标识符形态
# 必然误报;该文件不可能出现字面密钥(密钥铁律:不进代码)。真实泄漏面
# (deploy/.env 等)不受本条影响——路径级 allowlist 只开此一处。
[allowlist]
description = "sandbox env builder concatenates runtime variables, not literal secrets"
paths = ['internal/tools/command\.go$']
