# 零密钥 CI(D-2026-09-22-git-native-collab 实施顺序第②步)。
# 三件套 = go vet + golangci-lint + go test ./...(与本地验收口径一致);
# 不配置任何 GitHub Secrets,模型调用一律不出本机。
# T8.1:test job 经 services 起 MySQL/Redis 验证栈(契约端口 13306/16379,
# sqltest/redistest 缺省指向;本地栈文件已随 D-2026-10-08-prod-oneclick 移除,
# CI services 即常态栈)+ BRAID_TEST_REQUIRE_STACK=1 把 sqltest/redistest
# 的静默 skip 翻成响亮失败——「CI 绿」= 集成/故障注入测试真跑过。
# gitleaks 作业执行铁律「密钥不进 git 历史」的 PR 级增量扫描。
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  # T8.1 services 化:端口对齐 testenv 默认值(13306/16379)⇒ 测试代码
  # 零 env 覆盖。已知偏差:services 无法传 redis CMD 尾参(noeviction 与
  # AOF no 本就是镜像默认,RDB 默认开但写 tmpfs 不落盘;maxmemory 不设,
  # 单 job 独占无逐出风险)——评估记录见 docs/DECISIONS.md D-2026-09-27-t81。
  # health-gate:容器不 healthy 则 job 直接失败,替代「撞上初始化中的
  # MySQL → 探活失败 → 全量 skip → 假绿」。tmpfs 压缩 MySQL 首次初始化。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 注入套件 eventually 等待 + 慢 runner 余量(原 15)
    env:
      BRAID_TEST_REQUIRE_STACK: "1" # skip → Fatalf:CI 绿 = 集成测试真跑
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 13306:3306
        env:
          # 占位凭证,与仓内 compose 同值(本地一次性验证容器口径,非真实凭证)
          MYSQL_ROOT_PASSWORD: braid_dev_root
          MYSQL_DATABASE: braid
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pbraid_dev_root"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
          --tmpfs /var/lib/mysql
      redis-queue:
        image: redis:7.4
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
          --tmpfs /data
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # PR 事件下列提交扫增量,需 pulls 读权限(其余作业不受影响)
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # 全历史可达,增量提交逐个扫
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # T6.4:告警规则单测(promtool test rules = ROADMAP 验收面)。与三件套
  # 正交:不触 Go 工具链;promtool 经官方镜像取用(与本地 promtool 3.7.2
  # 同源),零 Secrets。
  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      # 镜像 ENTRYPOINT = /bin/prometheus:必须显式改指 promtool,否则
      # 参数被 prometheus 主程序吞掉(rev4 HIGH,本地已复现)。
      - name: promtool check rules
        run: >
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro"
          prom/prometheus:v3.7.2 check rules /rules/alerts.yml
      - name: promtool test rules
        run: >
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro"
          prom/prometheus:v3.7.2 test rules /rules/alerts_test.yml

  # T14.4:Helm chart 静态门(D-2026-09-30-t144-helm 决策 1)。与 promtool
  # 同模式:工具经钉版镜像取用(alpine/helm / kubeconform / yq),零
  # Secrets。断言 = helm lint + kubeconform strict(钉 K8s schema 1.31.0)
  # + compose 对拍(交付面等价可执行化:逐组件 env 键集 / 对象清单 /
  # Redis 契约 / 零宿主暴露 / required 执法 / values 零密钥默认),脚本
  # 本地同口径可跑(deploy/chart/tests/verify.sh)。
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: chart static gate
        run: deploy/chart/tests/verify.sh

  # T14.1:画布前端作业(D-2026-09-30-t141-canvas-pipeline 决策 2+3)。
  # 工具链经钉版镜像取用(node:26.10.0-bookworm,与 web/canvas/.nvmrc
  # 数值人工同步——改 .nvmrc 必须同改本 tag),零 Secrets。
  # 容器内只跑 npm(ci/test/build),并以 runner uid 运行(-u + HOME=/tmp,
  # 同 e2e 作业口径):① 挂载仓内不落 root 属主文件 —— 门自证要往
  # web/canvas/.dist-verify/ 注入漂移,root 属主会让宿主步骤拿不到写权限
  # (CI 首轮实测踩到);② 容器内不跑 git,故不会触发 dubious ownership,
  # 门的判据在宿主步骤用 runner 自带 git 执行。
  #
  # T21.5:漂移门判据 = 「入库产物逐字节等于从入库源码重建的结果」。
  # 构建落临时目录 web/canvas/.dist-verify(rm -rf + build:verify,CLI --outDir
  # 覆盖 vite 配置;不再就地重写 checkout),宿主跑
  # web/canvas/scripts/dist-drift-gate.sh:对象四守卫(不存在/无入库文件/
  # 重建未就位/两侧同源)+ outDir 配置断言 + diff -r --no-dereference 逐文件
  # 比对,差异行即修复清单(内容不同 / 只在一侧 / 二进制 / 软链类型都拦)。
  # 替换旧形态(就地重建 + git status,PR #200 后):那条判据依赖「构建写
  # 到门所看的路径」——vite build.outDir 被改走而 dist 不同步时,重建落
  # 新路径、旧 dist 原样,git status 对门对象干净 = 对冻结目录恒绿,此后
  # 源码再漂也一路绿(真机复现见 issue #205;PR #200 的 tracked-file 守卫
  # 只挡「对象整体消失」,挡不住「构建不再写它」)。现判据比对两个目录,
  # 与构建写到哪里无关,outDir 漂移另有配置断言直接红。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: canvas test + verify build
        run: >
          docker run --rm -v "$PWD:/src" -w /src/web/canvas
          -u "$(id -u):$(id -g)" -e HOME=/tmp node:26.10.0-bookworm
          sh -c "npm ci && npm test && npm run build:verify"
      - name: dist drift gate
        run: web/canvas/scripts/dist-drift-gate.sh
      # 门自证(该门曾静默恒绿三天,PR #200;T21.5 对抗审计又实测出两种假绿:
      # diff 解引用软链、两侧同源自比)。判据本体就是上面那个脚本,故这里钉的
      # 是「这些注入必须判红」,其中最后一条用**默认参数**调用 = 钉住 CI 真正
      # 的调用面(显式传参的自证挡不住「CI 调错一对目录」)。
      - name: drift gate self-test
        run: |
          set -euo pipefail
          gate=web/canvas/scripts/dist-drift-gate.sh
          must_red() {
            local why=$1; shift
            if "$gate" "$@" >/dev/null 2>&1; then
              echo "::error::漂移门自证失败:$why 仍判绿"
              exit 1
            fi
            echo "self-test red: $why"
          }
          probe="$(mktemp -d)/probe"
          cp -a internal/api/web "$probe"
          printf '/* injected drift */\n' >> "$probe/index.html"
          must_red "内容漂移" internal/api/web "$probe"
          rm -rf "$probe/assets"
          must_red "缺文件" internal/api/web "$probe"
          must_red "门对象缺失(守卫 1)" internal/api/web/no-such-dir
          must_red "重建结果缺失(守卫 3)" internal/api/web "$(mktemp -d)/none"
          must_red "入库面空目录(守卫 2)" "$(mktemp -d)"
          printf '/* injected drift */\n' >> web/canvas/.dist-verify/index.html
          must_red "默认参数(CI 实际调用)注入漂移"
          echo "drift gate self-test: ok (6 injections all red)"

  # T16.6:回滚-重跑浏览器级 e2e(D-2026-10-04-t166-playwright-e2e)。
  # 栈 = deploy/e2e-up.sh 单一真源(compose 数据面 MySQL 13307/Redis
  # 16380——Redis 走 AOF 契约,services 传不了 CMD 尾参故不起 job
  # services;migrate 镜像一发;CLI 种子;api/relay/worker/reaper 四
  # 进程,api 18081)。测试经钉版 playwright 镜像 --network host 容器内
  # npm ci && npx playwright test:浏览器二进制随镜像自带 = 零缓存管理;
  # @playwright/test devDep 版本与镜像 tag 人工同步(同 node/.nvmrc
  # 纪律);容器以 runner uid 运行(浏览器路径镜像内全可读,HOME=/tmp
  # 承载 npm 缓存)。e2e 消费入库 dist(go:embed,go run 编译即得),
  # 与 web 作业漂移门零交互。零 Secrets:LLM 三件/JWT 均低熵占位,
  # e2e 工作流零 LLM 节点执行。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # 失同步 fail-fast(对抗审计 LOW):镜像 tag 与 devDep 双侧人工同步,
      # 漂移时 e2e 作业以难读形态红——此处单点比较,给一行人话。
      - name: playwright pin drift guard
        run: |
          tag=$(grep -oE 'playwright:v[0-9.]+' .github/workflows/ci.yml | head -1 | cut -d: -f2 | tr -d v)
          dep=$(grep -oE '"@playwright/test": "[0-9.]+"' web/canvas/package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ "$tag" = "$dep" ] || { echo "::error::playwright 镜像 tag v$tag 与 @playwright/test $dep 失同步(两处必须同改)"; exit 1; }
      - name: bring up e2e stack
        run: deploy/e2e-up.sh
      # 挂载用宿主同路径(-v "$PWD:$PWD"):spec 从 cwd 解析 fixture 绝对
      # 路径,须与宿主 worker 的 BRAID_FILEREAD_DIRS 白名单逐字节一致
      # (对抗审计 HIGH:/src 重映射会让 file_read 恒 PathBlocked)。
      # test-results/playwright-report 落回挂载仓内 → 失败时可上传。
      - name: playwright e2e (pinned image)
        run: >
          docker run --rm --network host
          -v "$PWD:$PWD" -w "$PWD/web/canvas" -u "$(id -u):$(id -g)" -e HOME=/tmp
          -e BRAID_E2E_BASE_URL=http://127.0.0.1:18081
          mcr.microsoft.com/playwright:v1.63.0-noble
          sh -c "npm ci && npx playwright test"
      - name: upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-e2e
          path: |
            web/canvas/test-results/
            web/canvas/playwright-report/
          if-no-files-found: ignore
      - name: tear down e2e stack
        if: always()
        run: |
          deploy/e2e-down.sh || true
          tail -n 40 log/e2e/*.log 2>/dev/null || true
