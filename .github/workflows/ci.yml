# 零密钥 CI(D-2026-09-22-git-native-collab 实施顺序第②步)。
# 三件套 = go vet + golangci-lint + go test ./...(与本地验收口径一致);
# 不配置任何 GitHub Secrets,模型调用一律不出本机。
# T8.1:test job 经 services 起 MySQL/Redis 验证栈(同 t13 契约端口
# 13306/16379,栈定义与 deploy/migrate-test.docker-compose.yml 双向互指,
# 改一处必须同步另一处)+ BRAID_TEST_REQUIRE_STACK=1 把 sqltest/redistest
# 的静默 skip 翻成响亮失败——「CI 绿」= 集成/故障注入测试真跑过。
# gitleaks 作业执行铁律「密钥不进 git 历史」的 PR 级增量扫描。
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  # T8.1 services 化:端口对齐 testenv 默认值(13306/16379)⇒ 测试代码
  # 零 env 覆盖。已知偏差:services 无法传 redis CMD 尾参(noeviction 与
  # AOF no 本就是镜像默认,RDB 默认开但写 tmpfs 不落盘;maxmemory 不设,
  # 单 job 独占无逐出风险)——评估记录见 docs/DECISIONS.md D-2026-09-27-t81。
  # health-gate:容器不 healthy 则 job 直接失败,替代「撞上初始化中的
  # MySQL → 探活失败 → 全量 skip → 假绿」。tmpfs 压缩 MySQL 首次初始化。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 注入套件 eventually 等待 + 慢 runner 余量(原 15)
    env:
      BRAID_TEST_REQUIRE_STACK: "1" # skip → Fatalf:CI 绿 = 集成测试真跑
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 13306:3306
        env:
          # 占位凭证,与仓内 compose 同值(本地一次性验证容器口径,非真实凭证)
          MYSQL_ROOT_PASSWORD: braid_dev_root
          MYSQL_DATABASE: braid
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pbraid_dev_root"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
          --tmpfs /var/lib/mysql
      redis-queue:
        image: redis:7.4
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
          --tmpfs /data
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # PR 事件下列提交扫增量,需 pulls 读权限(其余作业不受影响)
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # 全历史可达,增量提交逐个扫
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # T6.4:告警规则单测(promtool test rules = ROADMAP 验收面)。与三件套
  # 正交:不触 Go 工具链;promtool 经官方镜像取用(与本地 promtool 3.7.2
  # 同源),零 Secrets。
  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      # 镜像 ENTRYPOINT = /bin/prometheus:必须显式改指 promtool,否则
      # 参数被 prometheus 主程序吞掉(rev4 HIGH,本地已复现)。
      - name: promtool check rules
        run: >
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro"
          prom/prometheus:v3.7.2 check rules /rules/alerts.yml
      - name: promtool test rules
        run: >
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro"
          prom/prometheus:v3.7.2 test rules /rules/alerts_test.yml
